[include mainsail.cfg]

[exclude_object]

[neopixel LED]
pin: P1.24
chain_count: 2
color_order: RGB
#initial_RED: 0.0
#initial_GREEN: 0.0
#initial_BLUE: 0.0
#initial_WHITE: 0.0

[z_tilt]
z_positions: 215, 117.5
                60, 117.5
points: 215, 117.5
          60, 117.5
speed: 150
horizontal_move_z: 5
retries: 20
retry_tolerance: .006

[display_status]

[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: P1.29
position_endstop: 0
position_max: 220
homing_speed: 150

[tmc2209 stepper_x]
uart_pin: P1.10
interpolate: True
run_current: 1
hold_current: 0.5

[stepper_y]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40
endstop_pin: P1.28
position_endstop: 0
position_max: 235
homing_speed: 150

[tmc2209 stepper_y]
uart_pin: P1.9
interpolate: True
run_current: 1
hold_current: 0.5

[stepper_z1]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z1]
uart_pin: P1.8
interpolate: True
run_current: 1
hold_current: 0.5

[stepper_z]
microsteps: 16
step_pin: P1.15
dir_pin: P1.14
enable_pin: !P1.16
endstop_pin: probe:z_virtual_endstop
rotation_distance: 8
position_max: 250
position_min: -5

[tmc2209 stepper_z]
uart_pin: P1.1
interpolate: True
run_current: 1
hold_current: 0.5

[extruder]
max_extrude_only_distance: 100.0
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
microsteps: 16
gear_ratio: 42:12
rotation_distance: 26.359
nozzle_diameter: 0.400
pressure_advance: 0.05
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.24
control: pid
pid_kp: 19.352
pid_ki: 1.058
pid_kd: 88.537
min_temp: 0
max_temp: 300

[tmc2209 extruder]
uart_pin: P1.4
interpolate: True
run_current: 0.9
hold_current: 0.5

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

[fan]
pin: P2.3

[heater_fan nozzle_fan]
pin: P2.4
max_power: 1.0
kick_start_time: 0.100
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1768_1950010D48104AAF2BA0675DC72000F5-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
square_corner_velocity: 10
max_z_velocity: 5
max_z_accel: 150

[bltouch]
sensor_pin: ^P0.10
control_pin: P2.0
x_offset: -31.4
y_offset: -40.1
#z_offset: +0
stow_on_each_sample: True
probe_with_touch_mode: True
pin_up_touch_mode_reports_triggered: False

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 15, 20
mesh_max: 185, 190
probe_count: 10,10
mesh_pps: 5,5
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[safe_z_home]
home_xy_position:117.5 , 117.5
speed: 100
z_hop: 20                 
z_hop_speed: 50

[bed_screws]
screw1: 30.5, 37
screw2: 30.5, 207
screw3: 204.5, 207
screw4: 204.5, 37

